<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eureca · Plano de Conteúdos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root{
    --ink:#211F2E; --ink-soft:#3E3C4C; --mint:#71FFB4; --mint-soft:#99FFBB;
    --teal:#1D8674; --paper:#FFFFFF; --paper-dim:#F6F5F8; --line:#E7E5EE;
    --grey:#888888; --danger:#E0574C; --warn:#E8A93B; --blue:#3355A8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--paper-dim);color:var(--ink);min-height:100vh;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--mint);color:var(--ink);}

  html,body{min-height:100%;}
  .screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;background:var(--ink);color:var(--paper);flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:19px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--mint);}
  .topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .pill-btn{background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,0.25)!important;padding:8px 16px;border-radius:100px;font-size:13px;font-weight:600;}
  .pill-btn:hover{border-color:var(--mint)!important;color:var(--mint);}

  .center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden;}
  .center-wrap::before{content:'';position:fixed;inset:0;background:var(--ink);z-index:-1;}
  .blob{position:fixed;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #C9A6F5 0%, #8FB6F0 45%, transparent 70%);filter:blur(60px);opacity:0.55;pointer-events:none;z-index:-1;}
  .blob.b1{bottom:-260px;left:-160px;} .blob.b2{top:-220px;right:-200px;opacity:0.35;}
  .auth-card{position:relative;z-index:1;background:var(--paper);border-radius:20px;padding:44px 40px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.35);}
  .auth-card .eyebrow{font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;}
  .auth-card h1{font-size:26px;margin:0 0 8px;}
  .auth-card p.sub{color:var(--grey);font-size:14px;margin:0 0 26px;line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-soft);}
  .field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:var(--paper-dim);color:var(--ink);outline:none;transition:border-color .15s;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal);background:var(--paper);}
  .field textarea{resize:vertical;min-height:70px;}
  .btn-primary{width:100%;padding:13px 18px;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;transition:background .15s;}
  .btn-primary:hover{background:var(--teal);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-mint{background:var(--mint);color:var(--ink);}
  .btn-mint:hover{background:var(--mint-soft);}
  .link-btn{background:none;color:var(--grey);font-size:13px;text-decoration:underline;padding:0;}
  .error-msg{color:var(--danger);font-size:13px;margin-top:-8px;margin-bottom:14px;}

  .main{flex:1;padding:32px;max-width:1180px;margin:0 auto;width:100%;}
  .main-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px;}
  .main-header h1{font-size:28px;margin:0 0 4px;}
  .main-header p{color:var(--grey);margin:0;font-size:14px;}
  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .client-card{background:var(--paper);border-radius:16px;padding:20px;border:1.5px solid var(--line);cursor:pointer;transition:transform .15s, box-shadow .15s;}
  .client-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(33,31,46,0.08);border-color:var(--teal);}
  .client-card h3{margin:0 0 10px;font-size:17px;}
  .status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:100px;}
  .chip.ok{background:#DFF9EB;color:var(--teal);}
  .chip.warn{background:#FDF1DC;color:#B4791F;}
  .chip.pending{background:#EFEDF5;color:var(--ink-soft);}
  .chip.info{background:#E9F0FF;color:var(--blue);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--grey);border:1.5px dashed var(--line);border-radius:16px;}
  .fab{position:fixed;bottom:28px;right:28px;background:var(--ink);color:var(--paper);padding:14px 22px;border-radius:100px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.25);display:flex;align-items:center;gap:8px;}
  .fab:hover{background:var(--teal);}

  .form-card{background:var(--paper);border-radius:18px;padding:32px;max-width:720px;margin:0 auto;border:1.5px solid var(--line);}
  .form-card h2{margin:0 0 4px;font-size:22px;}
  .form-card p.hint{color:var(--grey);font-size:13px;margin:0 0 24px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.grid-2{grid-template-columns:1fr;}}
  .range-row{display:flex;align-items:center;gap:12px;}
  .range-row input[type=range]{flex:1;}
  .range-val{font-weight:700;min-width:26px;text-align:center;}

  .progress-wrap{max-width:520px;margin:80px auto;text-align:center;}
  .progress-bar{height:8px;background:var(--line);border-radius:100px;overflow:hidden;margin:20px 0 12px;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));transition:width .3s;}
  .progress-log{font-size:13px;color:var(--grey);min-height:18px;}
  .spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);animation:spin 0.8s linear infinite;margin:0 auto 20px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .board-header{background:var(--ink);color:var(--paper);padding:36px 32px;position:relative;overflow:hidden;}
  .board-header .blob{width:420px;height:420px;top:-180px;right:-120px;opacity:0.4;}
  .board-header-inner{position:relative;z-index:1;max-width:1180px;margin:0 auto;}
  .board-header .eyebrow{color:var(--mint);font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;}
  .board-header h1{font-size:30px;margin:0 0 6px;}
  .board-header p{color:#C9C6D6;font-size:14px;margin:0;max-width:600px;line-height:1.5;}
  .summary-bar{display:flex;gap:20px;margin-top:22px;flex-wrap:wrap;}
  .summary-item{font-size:13px;color:#C9C6D6;}
  .summary-item b{color:var(--paper);font-size:18px;display:block;font-family:'Space Grotesk';}

  .board{max-width:1180px;margin:0 auto;padding:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}
  .post-card{background:var(--paper);border-radius:18px;border:1.5px solid var(--line);overflow:hidden;display:flex;flex-direction:column;}
  .post-card-top{padding:20px 22px 16px;border-bottom:1px solid var(--line);}
  .post-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:var(--paper-dim);color:var(--ink-soft);}
  .tag.format{background:#E9F0FF;color:var(--blue);}
  .post-card-top h3{margin:0;font-size:17px;line-height:1.3;}
  .post-card-body{padding:18px 22px;flex:1;display:flex;flex-direction:column;gap:14px;}
  .field-block .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--grey);margin-bottom:5px;}
  .field-block .value{font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
  .trend-note{background:#F1FCF6;border:1px solid #CFF2DE;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--teal);line-height:1.5;}

  .stage{border-top:1px solid var(--line);padding:16px 22px;background:var(--paper-dim);}
  .stage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .stage-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:100px;}
  .status-pill.pendente,.status-pill.aguardando,.status-pill.nao_agendado{background:#EFEDF5;color:var(--ink-soft);}
  .status-pill.aprovado,.status-pill.aprovada,.status-pill.publicado{background:#DFF9EB;color:var(--teal);}
  .status-pill.alteracao{background:#FDF1DC;color:#B4791F;}
  .status-pill.descartado{background:#F1F0F5;color:var(--grey);text-decoration:line-through;}
  .status-pill.enviada,.status-pill.agendado{background:#E9F0FF;color:var(--blue);}
  .status-pill.locked{background:#F1F0F5;color:#B7B4C2;}

  .comment-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:120px;overflow-y:auto;}
  .comment-item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;}
  .comment-item .meta{color:var(--grey);font-size:11px;margin-bottom:3px;}
  .action-row{display:flex;gap:8px;}
  .action-row button{flex:1;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;}
  .btn-approve{background:var(--teal);color:var(--paper);}
  .btn-approve:hover{background:#166B5C;}
  .btn-change{background:var(--paper);border:1.5px solid var(--line)!important;color:var(--ink-soft);}
  .btn-change:hover{border-color:var(--warn)!important;color:#B4791F;}
  .comment-input-row{display:flex;gap:8px;margin-top:8px;}
  .comment-input-row input{flex:1;}

  .ai-suggestion{background:#FFF9EC;border:1.5px dashed #E8C77A;border-radius:12px;padding:14px;margin-top:10px;}
  .ai-suggestion .label{font-size:11px;font-weight:800;color:#9A6B1E;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .ai-suggestion .value{font-size:13px;line-height:1.5;margin-bottom:8px;}
  .ai-suggestion-actions{display:flex;gap:8px;margin-top:10px;}
  .ai-suggestion-actions button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700;}

  .admin-post-edit{padding:14px 22px;border-top:1px dashed var(--line);}
  .admin-post-edit textarea, .admin-post-edit input{margin-bottom:8px;}
  .edit-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .btn-small{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;}
  .btn-ghost{background:var(--paper-dim);color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--line);}

  .art-preview{width:100%;border-radius:10px;margin-bottom:10px;display:block;background:var(--paper-dim);min-height:80px;}
  .art-upload-label{display:inline-block;padding:9px 14px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:700;cursor:pointer;}
  .art-upload-label:hover{background:var(--teal);}
  .art-upload-input{display:none;}
  .locked-note{font-size:12px;color:var(--grey);font-style:italic;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:100px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.3);z-index:999;display:none;}
  .back-link{background:none;color:var(--grey);font-size:13px;font-weight:600;margin-bottom:18px;display:inline-flex;align-items:center;gap:6px;}
  .back-link:hover{color:var(--ink);}

  /* ---- Intro do cliente ---- */
  .intro-wrap{max-width:720px;margin:0 auto;padding:60px 32px;}
  .intro-wrap .eyebrow{font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;}
  .intro-wrap h1{font-size:32px;margin:0 0 8px;}
  .intro-wrap .periodo{color:var(--grey);font-size:14px;margin:0 0 32px;}
  .process-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px;}
  @media(max-width:640px){.process-steps{grid-template-columns:1fr;}}
  .process-step{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:18px;}
  .process-step .num{font-size:11px;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
  .process-step h4{margin:0 0 6px;font-size:15px;}
  .process-step p{margin:0;font-size:12.5px;color:var(--grey);line-height:1.5;}

  /* ---- Calendário (lista) ---- */
  .calendar-list{max-width:820px;margin:0 auto;padding:0 32px 60px;display:flex;flex-direction:column;gap:10px;}
  .calendar-row{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:border-color .15s, transform .15s;}
  .calendar-row:hover{border-color:var(--teal);transform:translateX(2px);}
  .calendar-row .num{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--ink-soft);min-width:56px;}
  .calendar-row .info{flex:1;min-width:0;}
  .calendar-row .info .tema{font-weight:600;font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .calendar-row .info .meta{font-size:12px;color:var(--grey);}
  .calendar-row .arrow{color:var(--grey);font-size:18px;}

  /* ---- Detalhe do post (estilo do template Eureca) ---- */
  .post-detail-page{max-width:1000px;margin:0 auto;padding:32px;position:relative;}
  .post-detail-blob{position:absolute;width:520px;height:520px;left:-140px;bottom:-80px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #C9A6F5 0%, #8FB6F0 45%, transparent 70%);filter:blur(70px);opacity:0.45;z-index:0;pointer-events:none;}
  .post-detail-inner{position:relative;z-index:1;}
  .post-detail-eyebrow{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--grey);margin-bottom:6px;}
  .post-detail-title{font-size:40px;color:var(--teal);margin:0 0 10px;}
  .post-detail-subtitle{font-size:15px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;}
  .post-detail-meta{font-size:13px;font-weight:700;color:var(--ink-soft);line-height:1.8;margin-bottom:28px;}
  .post-detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;}
  @media(max-width:760px){.post-detail-grid{grid-template-columns:1fr;}}
  .pd-label{font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;position:relative;padding-top:14px;}
  .pd-label::before{content:'';position:absolute;top:0;left:0;width:26px;height:3px;background:var(--teal);}
  .pd-value{font-size:14px;line-height:1.6;white-space:pre-wrap;margin-bottom:24px;}
  .pd-art-box{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--grey);font-size:13px;background:rgba(255,255,255,0.6);}
  .pd-art-box img{max-width:100%;border-radius:10px;}
  .pd-status-box{background:rgba(255,255,255,0.75);backdrop-filter:blur(2px);border-radius:14px;padding:18px;margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

function escapeHtml(str){ if(!str) return ''; return str.toString().replace(/[&<>"]/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }
function escapeAttr(str){ return escapeHtml(str); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(()=>{ t.style.display='none'; }, 2600);
}

/* ==================== CONFIGURAÇÃO DA API (URL do Apps Script) ==================== */
const DEFAULT_API_URL = 'https://script.google.com/a/macros/grupoanga.com/s/AKfycbz6whqWa8XuLitit06BVdyh57ny4Nf6KcadaAIObO6Wg5hVKK8H6pfm1pc_Y5KqTF5L/exec';
function getApiUrl(){ return localStorage.getItem('eureca-api-url') || DEFAULT_API_URL; }
function setApiUrl(url){ localStorage.setItem('eureca-api-url', url); }

/* ==================== PONTE COM O BACKEND (fetch, com fallback JSONP) ==================== */
async function apiGet(action, params){
  const url = new URL(getApiUrl());
  url.searchParams.set('action', action);
  Object.keys(params||{}).forEach(k=> url.searchParams.set(k, params[k]));
  try{
    const res = await fetch(url.toString());
    if(!res.ok) throw new Error('http-'+res.status);
    return await res.json();
  }catch(e){
    return await jsonpGet_(url.toString());
  }
}
function jsonpGet_(url){
  return new Promise((resolve, reject)=>{
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const timeoutId = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 20000);
    function cleanup(){ clearTimeout(timeoutId); delete window[cb]; if(script.parentNode) script.parentNode.removeChild(script); }
    window[cb] = (data)=>{ cleanup(); resolve(data); };
    const sep = url.indexOf('?')>=0 ? '&' : '?';
    const script = document.createElement('script');
    script.src = url + sep + 'callback=' + cb;
    script.onerror = ()=>{ cleanup(); reject(new Error('script-error')); };
    document.body.appendChild(script);
  });
}
let __eurecaMsgCounter = 0;
function apiPost(action, payload){
  return new Promise((resolve, reject)=>{
    const frameName = 'eureca_frame_' + (__eurecaMsgCounter++);
    const iframe = document.createElement('iframe');
    iframe.name = frameName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = getApiUrl();
    form.target = frameName;
    form.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(Object.assign({action}, payload));
    form.appendChild(input);
    document.body.appendChild(form);

    // Geração de plano pode demorar bastante (vários posts em sequência) — damos até 9 minutos.
    // Cada chamada agora gera só 1 post (não o plano inteiro), então 90s já é folgado.
    const timeoutId = setTimeout(()=>{ cleanup(); reject(new Error('A IA demorou demais pra responder (mais de 90s). Tente de novo.')); }, 90000);
    function cleanup(){
      clearTimeout(timeoutId);
      window.removeEventListener('message', onMessage);
      if(form.parentNode) form.parentNode.removeChild(form);
      if(iframe.parentNode) iframe.parentNode.removeChild(iframe);
    }
    function onMessage(ev){
      if(ev.data && ev.data.__eurecaResponse){
        cleanup();
        if(ev.data.data && ev.data.data.error) reject(new Error(ev.data.data.error));
        else resolve(ev.data.data);
      }
    }
    window.addEventListener('message', onMessage);
    form.submit();
  });
}

/* Mapeamento de resposta do formulário -> briefing (feito no navegador, sem chamada de rede) */
function sleep_(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }

// Gemini 2.5 Flash Lite permite 10 chamadas por minuto nesta conta — 7s de
// intervalo mantém uma margem segura sem exagerar na espera.
const GEMINI_FREE_TIER_PACING_MS = 7000;

async function generatePlanWithProgress(brief, total, onProgress){
  const posts = [];
  for(let i=1;i<=total;i++){
    if(state.cancelRequested){ throw new Error('Geração cancelada.'); }
    onProgress(Math.round((i-1)/total*100), `Gerando post ${i} de ${total}...`);
    const post = await apiPost('regeneratePost', {brief, index:i, total, outrosPosts: posts});
    posts.push(post);
    if(i < total){
      if(state.cancelRequested){ throw new Error('Geração cancelada.'); }
      onProgress(Math.round(i/total*100), `Aguardando (limite da API gratuita) antes do próximo post...`);
      await sleep_(GEMINI_FREE_TIER_PACING_MS);
    }
  }
  onProgress(100, 'Plano gerado!');
  return posts;
}

function mapRowToBrief(row){
  const brief = { programa:'', tipoPrograma:'', objetivoEmail:'', areasVaga:'', sobreAreas:'', periodoInscricoes:'', faseTestes:'', beneficios:'', modalidade:'', ondeInscrever:'', motivoInteresse:'', requisitos:'', algoMais:'', cronograma:'', valorBolsa:'', mote:'', tomVoz:'', redes:'', sobreEmpresa:'' };
  for(const key in row){
    const k = key.toLowerCase(); const val = (row[key]||'').toString().trim();
    if(!val) continue;
    if(k.includes('carimbo') || k.includes('timestamp')) continue;
    else if(k.includes('nome do programa')) brief.programa = val;
    else if(k.includes('tipo de programa')) brief.tipoPrograma = val;
    else if(k.includes('objetivo desse e-mail') || k.includes('objetivo desse email')) brief.objetivoEmail = val;
    else if(k.includes('áreas de vaga') || k.includes('areas de vaga')) brief.areasVaga = val;
    else if(k.includes('sei sobre essas áreas') || k.includes('sei sobre essas areas')) brief.sobreAreas = val;
    else if(k.includes('período de inscri') || k.includes('periodo de inscri')) brief.periodoInscricoes = val;
    else if(k.includes('fase de testes')) brief.faseTestes = val;
    else if(k.includes('benefício') || k.includes('beneficio')) brief.beneficios = val;
    else if(k.includes('modalidade de trabalho')) brief.modalidade = val;
    else if(k.includes('onde a pessoa deve se inscrever')) brief.ondeInscrever = val;
    else if(k.includes('interessar a base de leads') || k.includes('motivo')) brief.motivoInteresse = val;
    else if(k.includes('requisito')) brief.requisitos = val;
    else if(k.includes('não foi perguntado') || k.includes('nao foi perguntado')) brief.algoMais = val;
    else if(k.includes('cronograma')) brief.cronograma = val;
    else if(k.includes('bolsa') || k.includes('salário') || k.includes('salario')) brief.valorBolsa = val;
    else if(k.includes('mote') || k.includes('conceito criativo')) brief.mote = val;
    else if(k.includes('tom de voz')) brief.tomVoz = val;
    else if(k.includes('redes sociais')) brief.redes = val;
    else if(k.includes('sobre a empresa')) brief.sobreEmpresa = val;
  }
  return brief;
}

/* ==================== COMPRESSÃO DE IMAGEM ==================== */
function compressImage(file, maxDim, quality){
  // Padrão mais conservador: a imagem agora é guardada numa célula da planilha
  // (limite de ~50 mil caracteres por célula), então precisa ficar bem leve.
  maxDim = maxDim || 700; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ==================== EXPORTAR PLANO EM PPTX ==================== */
async function exportarPlanoPPTX(slug, nome){
  showToast('Gerando PPTX...');
  const client = await apiGet('getClient', {slug});
  if(!client){ showToast('Não foi possível carregar o plano.'); return; }

  const pres = new PptxGenJS();
  pres.layout = 'LAYOUT_WIDE';
  const INK = '211F2E', MINT = '71FFB4', TEAL = '1D8674', GREY = '888888';

  const capa = pres.addSlide();
  capa.background = { color: INK };
  capa.addText('eureca', { x:0.5, y:0.4, fontSize:20, bold:true, color:MINT, fontFace:'Arial' });
  capa.addText('PLANO DE CONTEÚDOS', { x:0.5, y:2.6, fontSize:14, color:MINT, bold:true, fontFace:'Arial' });
  capa.addText(nome, { x:0.5, y:3.0, fontSize:36, color:'FFFFFF', bold:true, fontFace:'Arial', w:12 });

  client.posts.forEach((p, idx)=>{
    const slide = pres.addSlide();
    slide.background = { color:'FFFFFF' };
    slide.addText(`PLANO DE CONTEÚDOS — ${nome}`, { x:0.5, y:0.3, fontSize:9, color:GREY, bold:true, fontFace:'Arial' });
    slide.addText(`Post ${idx+1}`, { x:0.5, y:0.6, fontSize:28, color:TEAL, bold:true, fontFace:'Arial' });
    slide.addText(`${p.tema||''}${p.formato ? ' / '+p.formato : ''}`, { x:0.5, y:1.25, fontSize:13, color:INK, bold:true, fontFace:'Arial', w:12 });
    slide.addText(`DATA DA POSTAGEM: ${formatarData(p.data)}    HORÁRIO: ${p.horario||'A definir'}`, { x:0.5, y:1.65, fontSize:10, color:INK, bold:true, fontFace:'Arial' });

    slide.addText('COPY', { x:0.5, y:2.15, fontSize:9, color:TEAL, bold:true, fontFace:'Arial' });
    slide.addText(p.copy||'', { x:0.5, y:2.4, fontSize:10, color:INK, fontFace:'Arial', w:6.2, h:3.5, valign:'top' });

    let yLeg = 2.15;
    Object.keys(p.legendas||{}).forEach(canal=>{
      if(!p.legendas[canal]) return;
      slide.addText('LEGENDA ' + canal.toUpperCase(), { x:7, y:yLeg, fontSize:9, color:TEAL, bold:true, fontFace:'Arial' });
      slide.addText(p.legendas[canal], { x:7, y:yLeg+0.25, fontSize:9.5, color:INK, fontFace:'Arial', w:5.8, h:1.8, valign:'top' });
      yLeg += 2.2;
    });
  });

  const fim = pres.addSlide();
  fim.background = { color: INK };
  fim.addText('eureca', { x:0.5, y:3.4, fontSize:24, bold:true, color:MINT, fontFace:'Arial' });
  fim.addText('Muito obrigado.', { x:0.5, y:4.0, fontSize:14, color:'FFFFFF', fontFace:'Arial' });

  await pres.writeFile({ fileName: `Plano de Conteúdos - ${nome}.pptx` });
  showToast('Download iniciado!');
}

function guessRowLabel(row, i){
  let ts='', name='';
  for(const k in row){
    const kl = k.toLowerCase();
    if((kl.includes('carimbo') || kl.includes('timestamp')) && row[k]) ts = row[k];
    if(kl.includes('nome do programa') && row[k] && !name) name = row[k];
  }
  return `${i+1}. ${name || 'Resposta sem nome identificado'}${ts ? ' — ' + ts : ''}`;
}

          <div class="field-block"><div class="label">Horário</div>

            </select>
          </div>
        </div>` : `
        <div class="post-detail-meta">
          DATA DA POSTAGEM: ${formatarData(p.data)}<br>

        <div class="post-detail-grid">

            ${p.trend_insight ? `<div class="trend-note">📈 ${escapeHtml(p.trend_insight)}</div>` : ''}

          </div>
          <div>

function renderLegendasBlocks(legendas){
  const canais = Object.keys(legendas||{}).filter(c=>legendas[c]);
  if(!canais.length) return '<div class="field-block"><div class="label">Legenda</div><div class="value" style="color:var(--grey);">Nenhuma legenda gerada.</div></div>';
  return canais.map(canal=>`
    <div class="field-block">
      <div class="label">Legenda ${escapeHtml(canal)}</div>
      <div class="value">${escapeHtml(legendas[canal])}</div>
    </div>`).join('');
}

function formatarData(data){
  if(!data) return 'A definir';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(data);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  return data; // já é texto tipo "A definir" ou outro formato
}

function statusLabel(kind, val){
  const map = {
    copy: {pendente:'Pendente de revisão', aprovado:'Aprovado', alteracao:'Pedido de alteração', descartado:'Descartado'},
    art: {aguardando:'Aguardando arte', enviada:'Arte enviada', aprovada:'Arte aprovada', alteracao:'Ajuste na arte pedido'},
    pub: {nao_agendado:'Não agendado', agendado:'Agendado', publicado:'Publicado'}
  };
  return map[kind][val] || val;
}

function applyFieldValue(post, field, value){
  const parts = field.split('::');
  const fieldKey = parts[0], canal = parts[1];
  if(fieldKey === 'copy') post.copy = value;
  else if(fieldKey === 'legenda' && canal){ post.legendas = post.legendas || {}; post.legendas[canal] = value; }
}

function renderFieldCollapse(idx, isTeam, fieldKey, canal, label, value){
  const editId = canal ? `${fieldKey}::${canal}` : fieldKey;
  return `
  <details class="field-collapse">
    <summary class="pd-label" style="cursor:pointer;">${escapeHtml(label)}</summary>
    <div class="pd-value">${escapeHtml(value)}</div>
    ${isTeam ? `
      <div style="padding:10px 0 4px;">
        <div class="field-block"><div class="label">Editar manualmente</div><textarea class="manual-field-edit" data-idx="${idx}" data-field="${escapeAttr(editId)}">${escapeHtml(value)}</textarea></div>
        <div class="field-block"><div class="label">Sugerir nova versão com IA (descreva o ajuste)</div>
          <input type="text" class="ai-field-comment" data-idx="${idx}" data-field="${escapeAttr(editId)}" placeholder="Ex: não mencionar 'segunda maior fabricante' aqui..." style="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;" />
        </div>
        <div class="edit-actions">
          <button class="btn-small btn-ghost save-field-edit" data-idx="${idx}" data-field="${escapeAttr(editId)}">Salvar edição</button>
          <button class="btn-small btn-ghost regen-field" data-idx="${idx}" data-field="${escapeAttr(editId)}">Gerar nova versão com IA</button>
        </div>
      </div>` : ''}
  </details>`;
}

function renderCopyStage(p, idx, isTeam){
  const comments = (p.copyComments||[]).map(c=>`<div class="comment-item"><div class="meta">${escapeHtml(c.author)} · ${c.date}</div>${escapeHtml(c.text)}</div>`).join('');
  const suggestion = (isTeam && p.aiSuggestion) ? `
    <div class="ai-suggestion">
      <div class="label">💡 Sugestão de ajuste da IA (baseada no comentário do cliente)</div>
      ${Object.keys(p.aiSuggestion.legendas||{}).map(canal=>`<div class="value"><b>Legenda ${escapeHtml(canal)}:</b> ${escapeHtml(p.aiSuggestion.legendas[canal])}</div>`).join('')}
      <div class="value"><b>Copy:</b> ${escapeHtml(p.aiSuggestion.copy)}</div>
      ${p.aiSuggestion.roteiro ? `<div class="value"><b>Roteiro:</b> ${escapeHtml(p.aiSuggestion.roteiro)}</div>` : ''}
      <div class="ai-suggestion-actions">
        <button class="btn-approve accept-suggestion" data-idx="${idx}">Aceitar</button>
        <button class="btn-change edit-suggestion" data-idx="${idx}">Editar antes</button>
        <button class="btn-change discard-suggestion" data-idx="${idx}">Descartar</button>
      </div>
    </div>` : '';

  const adminEdit = isTeam ? `
    <div class="admin-post-edit">
      <div class="edit-actions">
        <button class="btn-small btn-ghost save-edit" data-idx="${idx}">Salvar edição</button>
        <button class="btn-small btn-ghost regen-post" data-idx="${idx}">Regenerar post inteiro com IA</button>
      </div>
    </div>` : '';

  const clientActions = (!isTeam && p.copyStatus !== 'aprovado') ? `
    <div class="comment-input-row"><input type="text" placeholder="Deixe um comentário sobre a copy..." class="copy-comment-box" data-idx="${idx}" /></div>
    <div class="action-row" style="margin-top:8px;">
      <button class="btn-approve" data-idx="${idx}" data-action="aprovado">Aprovar copy</button>
      <button class="btn-change" data-idx="${idx}" data-action="alteracao">Pedir alteração</button>
    </div>` : '';

  return `
  <div class="stage">
    <div class="stage-head"><span class="stage-title">Etapa 1 · Copy</span><span class="status-pill ${p.copyStatus}">${statusLabel('copy',p.copyStatus)}</span></div>
    ${comments ? `<div class="comment-list">${comments}</div>` : ''}
    ${suggestion}
    ${adminEdit}
    ${clientActions}
  </div>`;
}

function ehFormatoVideo(formato){
  const f = (formato||'').toLowerCase();
  return f.includes('reel') || f.includes('vídeo') || f.includes('video');
}

function renderArtStage(p, idx, isTeam){
  const unlocked = isTeam || p.copyStatus === 'aprovado';
  if(!unlocked){
    return `<div class="stage"><div class="stage-head"><span class="stage-title">Etapa 2 · Arte</span><span class="status-pill locked">Bloqueado</span></div><div class="locked-note">Libera quando a copy for aprovada.</div></div>`;
  }
  const comments = (p.artComments||[]).map(c=>`<div class="comment-item"><div class="meta">${escapeHtml(c.author)} · ${c.date}</div>${escapeHtml(c.text)}</div>`).join('');
  const imgTag = p.artImageUrl ? `<img class="art-preview" src="${escapeAttr(p.artImageUrl)}" alt="Arte do post" />` : '';

  const videoBlock = ehFormatoVideo(p.formato) ? `
    <div style="margin:10px 0;">
      <div class="label" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--grey);margin-bottom:6px;">Link do vídeo (Drive, YouTube, etc.)</div>
      ${isTeam ? `
        <div style="display:flex;gap:8px;">
          <input type="text" class="edit-video-url" data-idx="${idx}" value="${escapeAttr(p.videoUrl||'')}" placeholder="https://..." style="flex:1;" />
          <button class="btn-small btn-ghost save-video-url" data-idx="${idx}">Salvar</button>
        </div>` : ''}
      ${p.videoUrl ? `<a href="${escapeAttr(p.videoUrl)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;font-size:12.5px;color:var(--teal);font-weight:700;">▶ Ver vídeo ↗</a>` : (!isTeam ? '<p style="font-size:12px;color:var(--grey);">Vídeo ainda não enviado.</p>' : '')}
    </div>` : '';

  const teamControls = isTeam ? `
    <label class="art-upload-label">${p.artImageUrl ? 'Trocar capa/arte' : 'Subir capa/arte'}<input type="file" accept="image/*" class="art-upload-input upload-art" data-idx="${idx}" /></label>
    ${p.artImageUrl ? `<button class="btn-small btn-ghost delete-art" data-idx="${idx}" style="margin-left:8px;">Excluir arte</button>` : ''}
  ` : '';

  const clientActions = (!isTeam && p.artStatus === 'enviada') ? `
    <div class="comment-input-row"><input type="text" placeholder="Comentário sobre a arte..." class="art-comment-box" data-idx="${idx}" /></div>
    <div class="action-row" style="margin-top:8px;">
      <button class="btn-approve" data-idx="${idx}" data-artaction="aprovada">Aprovar arte</button>
      <button class="btn-change" data-idx="${idx}" data-artaction="alteracao">Pedir alteração</button>
    </div>` : '';

  return `
  <div class="stage">
    <div class="stage-head"><span class="stage-title">Etapa 2 · Arte</span><span class="status-pill ${p.artStatus}">${statusLabel('art',p.artStatus)}</span></div>
    ${videoBlock}
    ${imgTag}
    ${teamControls}
    ${comments ? `<div class="comment-list" style="margin-top:8px;">${comments}</div>` : ''}
    ${clientActions}
  </div>`;
}

function renderPubStage(p, idx, isTeam){
  const unlocked = p.artStatus === 'aprovada';
  if(!unlocked){
    return `<div class="stage"><div class="stage-head"><span class="stage-title">Etapa 3 · Publicação</span><span class="status-pill locked">Bloqueado</span></div><div class="locked-note">Libera quando a arte for aprovada.</div></div>`;
  }
  const teamControls = isTeam ? `
    <div class="action-row">
      <button class="btn-change set-pub" data-idx="${idx}" data-pub="agendado">Marcar agendado</button>
      <button class="btn-approve set-pub" data-idx="${idx}" data-pub="publicado">Marcar publicado</button>
    </div>` : '';
  return `
  <div class="stage">
    <div class="stage-head"><span class="stage-title">Etapa 3 · Publicação</span><span class="status-pill ${p.pubStatus}">${statusLabel('pub',p.pubStatus)}</span></div>
    ${teamControls}
  </div>`;
}

/* ==================== HANDLERS ==================== */
function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  if($('#setup-save')){
    $('#setup-save').onclick = ()=>{
      const url = $('#setup-url').value.trim();
      if(!url || url.indexOf('http')!==0){ $('#setup-error').style.display='block'; return; }
      setApiUrl(url);
      state.view = 'welcome'; render();
    };
  }
  if($('#change-api-url')){
    $('#change-api-url').onclick = ()=>{ state.view='setup'; render(); };
  }

  if($('#go-team')) $('#go-team').onclick = ()=>{ state.view='team-login'; render(); };
  if($('#go-client')) $('#go-client').onclick = ()=>{ state.view='client-login'; render(); };
  if($('#back-welcome')) $('#back-welcome').onclick = ()=>{ state.view='welcome'; render(); };
  if($('#logout')) $('#logout').onclick = ()=>{ localStorage.removeItem('eureca-session'); state = {...state, view:'welcome', currentSlug:null, currentClient:null, role:null}; render(); };
  if($('#back-dashboard')) $('#back-dashboard').onclick = async ()=>{ state.clientsIndex = await apiGet('getClientsIndex'); state.view='team-dashboard'; render(); };
  if($('#edit-brief')) $('#edit-brief').onclick = ()=>{ state.view='team-edit-brief'; render(); };
  if($('#back-review')) $('#back-review').onclick = ()=>{ state.view='team-intro'; render(); };

  if($('#team-submit')){
    $('#team-submit').onclick = async ()=>{
      const btn = $('#team-submit'); const errEl = $('#team-error');
      if(errEl) errEl.style.display='none';
      btn.disabled = true; const originalText = btn.textContent; btn.textContent = 'Entrando...';
      try{
        const ok = await apiGet('checkTeamPasscode', {pass: $('#team-pass').value});
        if(ok){ state.role='team'; localStorage.setItem('eureca-session', JSON.stringify({role:'team'})); state.clientsIndex = await apiGet('getClientsIndex'); state.view='team-dashboard'; render(); return; }
        else if(errEl){ errEl.textContent = 'Senha incorreta.'; errEl.style.display='block'; }
      }catch(err){
        if(errEl){ errEl.textContent = 'Não foi possível conectar à API. Erro: ' + err.message; errEl.style.display='block'; }
      }
      btn.disabled = false; btn.textContent = originalText;
    };
  }
  if($('#client-submit')){
    $('#client-submit').onclick = async ()=>{
      const btn = $('#client-submit'); const errEl = $('#client-error');
      if(errEl) errEl.style.display='none';
      btn.disabled = true; const originalText = btn.textContent; btn.textContent = 'Buscando...';
      try{
        const name = $('#client-name').value.trim();
        const slug = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
        const client = await apiGet('getClient', {slug});
        if(client){ state.role='client'; localStorage.setItem('eureca-session', JSON.stringify({role:'client', slug})); state.currentSlug = slug; state.currentClient = client; state.view='client-intro'; render(); return; }
        else if(errEl){ errEl.textContent = 'Não encontramos um plano com esse nome.'; errEl.style.display='block'; }
      }catch(err){
        if(errEl){ errEl.textContent = 'Não foi possível conectar à API. Erro: ' + err.message; errEl.style.display='block'; }
      }
      btn.disabled = false; btn.textContent = originalText;
    };
  }
  if($('#go-calendar')) $('#go-calendar').onclick = ()=>{ state.view = state.role==='team' ? 'team-calendar' : 'client-calendar'; render(); };
  if($('#back-intro')) $('#back-intro').onclick = ()=>{ state.view = state.role==='team' ? 'team-intro' : 'client-intro'; render(); };
  if($('#back-calendar')) $('#back-calendar').onclick = ()=>{ state.view = state.role==='team' ? 'team-calendar' : 'client-calendar'; render(); };
  $$('.calendar-row').forEach(row=>{
    row.onclick = ()=>{ state.currentPostIdx = parseInt(row.getAttribute('data-idx'),10); state.view = state.role==='team' ? 'team-post' : 'client-post'; render(); };
  });
  if($('#cancel-generation')) $('#cancel-generation').onclick = ()=>{ state.cancelRequested = true; showToast('Cancelando...'); };

  if($('#new-plan')) $('#new-plan').onclick = ()=>{ state.view='team-brief'; render(); };
  if($('#f-total')) $('#f-total').oninput = (e)=>{ $('#f-total-val').textContent = e.target.value; };

  if($('#response-select')){
    (async ()=>{
      const rows = await apiGet('getFormResponses');
      state.formResponses = rows;
      const sel = $('#response-select');
      sel.innerHTML = '<option value="">Selecione uma resposta...</option>' + rows.map((row,i)=>`<option value="${i}">${escapeHtml(guessRowLabel(row,i))}</option>`).join('');
      sel.onchange = async (e)=>{
        const v = e.target.value; if(v==='') return;
        const brief = mapRowToBrief(rows[parseInt(v,10)]);
        fillBriefForm(brief);
        showToast('Campos preenchidos. Revise e edite antes de gerar.');
      };
    })();
  }

  function fillBriefForm(brief){
    const set = (id, val) => { const el = document.getElementById(id); if(el) el.value = val || ''; };
    ['programa','tipoPrograma','objetivoEmail','areasVaga','sobreAreas','periodoInscricoes','faseTestes','beneficios','modalidade','valorBolsa','requisitos','ondeInscrever','cronograma','motivoInteresse','mote','tomVoz','redes','algoMais','sobreEmpresa'].forEach(f=>{
      set('f-'+f, brief[f]);
    });
  }
  function readBriefFromForm(){
    const fields = ['programa','sobreEmpresa','tipoPrograma','objetivoEmail','periodoAtracao','tagInterna','areasVaga','sobreAreas','periodoInscricoes','faseTestes','beneficios','modalidade','valorBolsa','requisitos','ondeInscrever','cronograma','motivoInteresse','mote','tomVoz','redes','algoMais'];
    const b = {};
    fields.forEach(f=>{ const el = document.getElementById('f-'+f); b[f] = el ? el.value.trim() : ''; });
    return b;
  }

  if($('#brief-submit')){
    $('#brief-submit').onclick = async ()=>{
      const programa = $('#f-programa').value.trim();
      const sobreEmpresa = $('#f-sobreEmpresa').value.trim();
      if(!programa || !sobreEmpresa){ $('#brief-error').style.display='block'; return; }
      const brief = readBriefFromForm();
      const total = parseInt($('#f-total').value, 10);
      const slug = programa.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

      state.cancelRequested = false; state.view='team-generating'; state.genProgress = {pct:0, log:'Iniciando...'}; render();
      try{
        const posts = await generatePlanWithProgress(brief, total, (pct, log)=>{ state.genProgress = {pct, log}; render(); });
        const clientRecord = { name: programa, slug, brief, posts, createdAt: new Date().toISOString() };
        await apiPost('saveClient', {client: clientRecord});
        state.clientsIndex = await apiGet('getClientsIndex');
        state.currentSlug = slug; state.currentClient = clientRecord; state.view = 'team-intro'; render();
        showToast('Plano gerado com sucesso!');
      }catch(err){
        state.view = 'team-brief'; render();
        showToast('Erro ao gerar o plano: ' + err.message);
      }
    };
  }

  if($('#save-brief-only')){
    $('#save-brief-only').onclick = async ()=>{
      if(!$('#f-sobreEmpresa').value.trim()){ $('#brief-error').style.display='block'; return; }
      const newBrief = readBriefFromForm();
      newBrief.programa = state.currentClient.brief.programa;
      state.currentClient.brief = newBrief;
      await apiPost('saveClient', {client: state.currentClient});
      state.view = 'team-intro'; render();
      showToast('Informações do programa atualizadas.');
    };
  }
  if($('#save-and-regen')){
    $('#save-and-regen').onclick = async ()=>{
      if(!$('#f-sobreEmpresa').value.trim()){ $('#brief-error').style.display='block'; return; }
      if(!window.confirm('Isso vai gerar um plano novo e substituir todos os posts, status e comentários atuais. Continuar?')) return;
      const newBrief = readBriefFromForm();
      newBrief.programa = state.currentClient.brief.programa;
      const total = parseInt($('#f-total').value, 10);
      const slug = state.currentClient.slug, nome = state.currentClient.name;

      state.cancelRequested = false; state.view='team-generating'; state.genProgress = {pct:0, log:'Iniciando...'}; render();
      try{
        const posts = await generatePlanWithProgress(newBrief, total, (pct, log)=>{ state.genProgress = {pct, log}; render(); });
        const clientRecord = { name: nome, slug, brief: newBrief, posts, createdAt: state.currentClient.createdAt, updatedAt: new Date().toISOString() };
        await apiPost('saveClient', {client: clientRecord});
        state.clientsIndex = await apiGet('getClientsIndex');
        state.currentSlug = slug; state.currentClient = clientRecord; state.view = 'team-intro'; render();
        showToast('Plano regenerado!');
      }catch(err){
        state.view = 'team-edit-brief'; render();
        showToast('Erro ao regenerar o plano: ' + err.message);
      }
    };
  }

  $$('.client-card').forEach(card=>{
    card.onclick = async ()=>{
      const slug = card.getAttribute('data-slug');
      state.currentSlug = slug; state.currentClient = await apiGet('getClient', {slug});
      state.view = 'team-intro'; render();
    };
  });

  if($('.delete-post')){
    $('.delete-post').onclick = async ()=>{
      const idx = parseInt($('.delete-post').getAttribute('data-idx'),10);
      if(!window.confirm('Excluir este post do plano? Isso não pode ser desfeito.')) return;
      state.currentClient.posts.splice(idx, 1);
      await apiPost('saveClient', {client: state.currentClient});
      state.view = state.role==='team' ? 'team-calendar' : 'client-calendar';
      render();
      showToast('Post excluído.');
    };
  }

  if($('.quick-status')){
    $('.quick-status').onchange = async (e)=>{
      const idx = parseInt(e.target.getAttribute('data-idx'),10);
      state.currentClient.posts[idx].copyStatus = e.target.value;
      await apiPost('saveClient', {client: state.currentClient});
      render();
      showToast('Status atualizado.');
    };
  }

  if($('#add-manual-post')){
    $('#add-manual-post').onclick = async ()=>{
      const novoPost = {
        id: 'post-manual-' + Date.now(), tema: 'Novo post (editar tema)', formato: 'Estático', canais: '',
        copy: '', legendas: {}, roteiro: '', trend_insight: '', data: 'A definir', horario: 'A definir', videoUrl: '',
        copyStatus: 'pendente', copyComments: [], aiSuggestion: null,
        artStatus: 'aguardando', artComments: [], artImageUrl: '', pubStatus: 'nao_agendado'
      };
      state.currentClient.posts.push(novoPost);
      state.currentPostIdx = state.currentClient.posts.length - 1;
      await apiPost('saveClient', {client: state.currentClient});
      state.view = 'team-post';
      render();
      showToast('Post adicionado — edite os campos abaixo.');
    };
  }

  if($('#change-position')){
    $('#change-position').onchange = async (e)=>{
      const fromIdx = parseInt(e.target.getAttribute('data-idx'),10);
      const toIdx = parseInt(e.target.value,10);
      if(fromIdx === toIdx) return;
      const posts = state.currentClient.posts;
      const [moved] = posts.splice(fromIdx, 1);
      posts.splice(toIdx, 0, moved);
      state.currentPostIdx = toIdx;
      await apiPost('saveClient', {client: state.currentClient});
      render();
      showToast(`Post movido para a posição ${toIdx+1}.`);
    };
  }

  $$('.download-plan-btn').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const slug = btn.getAttribute('data-slug');
      const name = btn.getAttribute('data-name');
      await exportarPlanoPPTX(slug, name);
    };
  });

  $$('.delete-client-btn').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const slug = btn.getAttribute('data-slug');
      const name = btn.getAttribute('data-name');
      if(!window.confirm(`Excluir o plano de "${name}"? Isso não pode ser desfeito.`)) return;
      await apiPost('deleteClient', {slug});
      state.clientsIndex = await apiGet('getClientsIndex');
      render();
      showToast('Plano excluído.');
    };
  });

  $$('.action-row [data-action]').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const action = btn.getAttribute('data-action');
      const input = document.querySelector(`.copy-comment-box[data-idx="${idx}"]`);
      const text = input ? input.value.trim() : '';
      const post = state.currentClient.posts[idx];
      post.copyStatus = action;
      if(text){ post.copyComments = post.copyComments || []; post.copyComments.push({author:'Cliente', text, date:new Date().toLocaleDateString('pt-BR')}); }
      await apiPost('saveClient', {client: state.currentClient});
      render();
      showToast(action==='aprovado' ? 'Copy aprovada!' : 'Pedido enviado. A equipe vai receber uma sugestão de ajuste da IA.');
      if(action === 'alteracao' && text){
        const suggestion = await apiPost('generateSuggestion', {brief: state.currentClient.brief, post, comentario: text});
        if(suggestion){ post.aiSuggestion = suggestion; await apiPost('saveClient', {client: state.currentClient}); }
      }
    };
  });

  $$('[data-artaction]').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const action = btn.getAttribute('data-artaction');
      const input = document.querySelector(`.art-comment-box[data-idx="${idx}"]`);
      const text = input ? input.value.trim() : '';
      const post = state.currentClient.posts[idx];
      post.artStatus = action;
      if(text){ post.artComments = post.artComments || []; post.artComments.push({author:'Cliente', text, date:new Date().toLocaleDateString('pt-BR')}); }
      await apiPost('saveClient', {client: state.currentClient});
      render();
      showToast(action==='aprovada' ? 'Arte aprovada!' : 'Pedido de ajuste na arte enviado.');
    };
  });

  $$('.accept-suggestion').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const post = state.currentClient.posts[idx];
      const s = post.aiSuggestion;
      if(s){ post.tema=s.tema; post.formato=s.formato; post.canais=s.canais; post.copy=s.copy; post.legendas=s.legendas; post.roteiro=s.roteiro; post.copyStatus='pendente'; post.aiSuggestion=null; }
      await apiPost('saveClient', {client: state.currentClient}); render(); showToast('Sugestão aplicada ao post.');
    };
  });
  $$('.edit-suggestion').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const post = state.currentClient.posts[idx];
      const s = post.aiSuggestion;
      if(s){ post.copy=s.copy; post.legendas=s.legendas; post.roteiro=s.roteiro; post.copyStatus='pendente'; post.aiSuggestion=null; }
      await apiPost('saveClient', {client: state.currentClient}); render();
      showToast('Sugestão carregada nos campos de edição — ajuste como quiser e salve.');
    };
  });
  $$('.discard-suggestion').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      state.currentClient.posts[idx].aiSuggestion = null;
      await apiPost('saveClient', {client: state.currentClient}); render(); showToast('Sugestão descartada.');
    };
  });

  $$('.save-edit').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const tema = document.querySelector(`.edit-tema[data-idx="${idx}"]`);
      const data = document.querySelector(`.edit-data[data-idx="${idx}"]`);
      const horario = document.querySelector(`.edit-horario[data-idx="${idx}"]`);
      const post = state.currentClient.posts[idx];
      if(tema) post.tema = tema.value;
      if(data && data.value) post.data = data.value;
      if(horario) post.horario = horario.value;
      await apiPost('saveClient', {client: state.currentClient}); render(); showToast('Post atualizado.');
    };
  });

  $$('.save-field-edit').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const field = btn.getAttribute('data-field');
      const textarea = document.querySelector(`.manual-field-edit[data-idx="${idx}"][data-field="${CSS.escape(field)}"]`);
      if(!textarea) return;
      applyFieldValue(state.currentClient.posts[idx], field, textarea.value);
      await apiPost('saveClient', {client: state.currentClient});
      render();
      showToast('Campo atualizado.');
    };
  });

  $$('.regen-field').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const field = btn.getAttribute('data-field');
      const commentInput = document.querySelector(`.ai-field-comment[data-idx="${idx}"][data-field="${CSS.escape(field)}"]`);
      const comentario = commentInput ? commentInput.value.trim() : '';
      if(!comentario){ showToast('Escreva o que deve mudar antes de gerar.'); return; }
      const post = state.currentClient.posts[idx];
      const fieldKey = field.split('::')[0];
      const canal = field.split('::')[1];
      const originalText = btn.textContent;
      btn.textContent = 'Gerando...'; btn.disabled = true;
      try{
        const result = await apiPost('regenerateField', {brief: state.currentClient.brief, post, field: fieldKey, canal, comentario});
        if(result && result.texto){
          applyFieldValue(post, field, result.texto);
          await apiPost('saveClient', {client: state.currentClient});
          render();
          showToast('Novo texto gerado.');
        } else {
          showToast('Não consegui gerar. Tenta de novo.');
          btn.textContent = originalText; btn.disabled = false;
        }
      }catch(e){
        showToast('Erro: ' + e.message);
        btn.textContent = originalText; btn.disabled = false;
      }
    };
  });

  $$('.regen-post').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      btn.textContent = 'Gerando...'; btn.disabled = true;
      const client = state.currentClient;
      const others = client.posts.filter((_,i)=>i!==idx);
      const newPost = await apiPost('regeneratePost', {brief: client.brief, index: idx+1, total: client.posts.length, outrosPosts: others});
      newPost.copyStatus = 'pendente';
      state.currentClient.posts[idx] = newPost;
      await apiPost('saveClient', {client: state.currentClient}); render(); showToast('Post regenerado.');
    };
  });

  $$('.save-video-url').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const input = document.querySelector(`.edit-video-url[data-idx="${idx}"]`);
      if(!input) return;
      state.currentClient.posts[idx].videoUrl = input.value.trim();
      await apiPost('saveClient', {client: state.currentClient});
      render();
      showToast('Link do vídeo salvo.');
    };
  });

  $$('.delete-art').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      if(!window.confirm('Excluir a arte deste post?')) return;
      const post = state.currentClient.posts[idx];
      post.artImageUrl = '';
      post.artStatus = 'aguardando';
      await apiPost('saveClient', {client: state.currentClient});
      render();
      showToast('Arte excluída.');
    };
  });

  $$('.upload-art').forEach(input=>{
    input.onchange = async (e)=>{
      const idx = parseInt(input.getAttribute('data-idx'),10);
      const file = e.target.files[0];
      if(!file) return;
      showToast('Enviando arte...');
      try{
        const dataUrl = await compressImage(file);
        const post = state.currentClient.posts[idx];
        post.artImageUrl = dataUrl;
        post.artStatus = 'enviada';
        await apiPost('saveClient', {client: state.currentClient});
        render();
        showToast('Arte enviada! O cliente já pode revisar.');
      }catch(err){
        showToast('Erro ao processar a imagem.');
      }
    };
  });

  $$('.set-pub').forEach(btn=>{
    btn.onclick = async ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'),10);
      const pub = btn.getAttribute('data-pub');
      state.currentClient.posts[idx].pubStatus = pub;
      await apiPost('saveClient', {client: state.currentClient}); render();
      showToast(pub==='publicado' ? 'Post marcado como publicado!' : 'Post agendado.');
    };
  });
}

async function initApp(){
  document.getElementById('app').innerHTML = `<div class="screen" style="align-items:center;justify-content:center;"><div class="progress-wrap"><div class="spinner"></div><h2>Carregando...</h2></div></div>`;
  state.view = 'welcome';
  try{
    const saved = JSON.parse(localStorage.getItem('eureca-session') || 'null');
    if(saved && saved.role === 'team'){
      state.role = 'team';
      state.clientsIndex = await apiGet('getClientsIndex');
      state.view = 'team-dashboard';
    } else if(saved && saved.role === 'client' && saved.slug){
      const client = await apiGet('getClient', {slug: saved.slug});
      if(client){ state.role = 'client'; state.currentSlug = saved.slug; state.currentClient = client; state.view = 'client-intro'; }
    }
  }catch(e){ /* sessão inválida, mantém tela de boas-vindas */ }
  render();
}
initApp();
</script>
</body>
</html>
